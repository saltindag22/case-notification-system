name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notifications"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://notifications:notifications@localhost:5432/notifications_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/15
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      RABBITMQ_MANAGEMENT_URL: http://localhost:15672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: notification-system:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack exactly as the README describes
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: docker compose run --rm smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color api worker mock-provider
      - name: Tear down
        if: always()
        run: docker compose down -v
