version: "2"

run:
  timeout: 5m

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    gosec:
      excludes:
        - G115   # integer conversions are bounded by validation (priority 1..3, durations)
        - G404   # math/rand is fine for jitter and the mock provider
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/saltindag22/case-notification-system
